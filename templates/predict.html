{% extends "base.html" %}

{% block body %}

<div class="prediction-page">

    <div class="prediction-container">

        <h1>Delivery Time Predictor</h1>

        <p>
            Enter the order details below. Our machine learning model
            will estimate the delivery time in minutes.
        </p>

        <form action="{{ url_for('predict') }}" method="post">

            <!-- Distance -->
            <div class="form-group">
                <label for="distance">Distance (km)</label>
                <input
                    type="number"
                    step="0.1"
                    id="distance"
                    name="distance"
                    placeholder="Enter distance"
                    required>
            </div>

            <!-- Traffic -->
            <div class="form-group">
                <label for="t_level">Traffic Level</label>
                <select id="t_level" name="t_level" required>
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
            </div>

            <!-- Preparation Time -->
            <div class="form-group">
                <label for="p_time">Preparation Time (min)</label>
                <input
                    type="number"
                    id="p_time"
                    name="p_time"
                    placeholder="Enter preparation time"
                    required>
            </div>

            <!-- Courier Experience -->
            <div class="form-group">
                <label for="experience">Courier Experience (years)</label>
                <input
                    type="number"
                    step="0.1"
                    id="experience"
                    name="experience"
                    placeholder="Enter courier experience"
                    required>
            </div>

            <!-- Weather -->
            <div class="form-group">
                <label for="weather">Weather Type</label>
                <select id="weather" name="weather" required>
                    <option value="Clear">Clear</option>
                    <option value="Foggy">Foggy</option>
                    <option value="Rainy">Rainy</option>
                    <option value="Snowy">Snowy</option>
                    <option value="Windy">Windy</option>
                </select>
            </div>

            <!-- Time -->
            <div class="form-group">
                <label for="time">Time of Day</label>
                <select id="time" name="time" required>
                    <option value="Morning">Morning</option>
                    <option value="Afternoon">Afternoon</option>
                    <option value="Evening">Evening</option>
                    <option value="Night">Night</option>
                </select>
            </div>

            <!-- Vehicle -->
            <div class="form-group">
                <label for="vehicle">Vehicle Type</label>
                <select id="vehicle" name="vehicle" required>
                    <option value="Bike">Bike</option>
                    <option value="Car">Car</option>
                    <option value="Scooter">Scooter</option>
                </select>
            </div>

            <button type="submit">
                Predict Delivery Time
            </button>

        </form>

        {% if prediction_text %}

        <div class="prediction-result">
            {{ prediction_text }}
        </div>

        {% endif %}

    </div>

</div>

{% endblock body %}
